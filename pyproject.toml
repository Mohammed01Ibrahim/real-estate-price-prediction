[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-price-prediction"
version = "0.1.0"
description = "Reproducible Peru residential USD asking-price regression with a shared Flask inference pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2",
  "Flask>=3.1,<4", "joblib>=1.4,<2", "matplotlib>=3.10,<4", "threadpoolctl>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real_estate = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
